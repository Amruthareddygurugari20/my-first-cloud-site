<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First AWS Project</title>
  <style>
    :root { --bg:#0b1020; --card:#131a2e; --accent:#ff9900; --text:#e8ecf5; --muted:#9aa4bf; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2545, var(--bg));
      color: var(--text); padding: 24px;
    }
    .card {
      background: var(--card); border:1px solid #243154; border-radius:18px;
      padding: 40px; max-width: 560px; width:100%; text-align:center;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .badge {
      display:inline-block; background:rgba(255,153,0,.12); color:var(--accent);
      border:1px solid rgba(255,153,0,.4); padding:6px 14px; border-radius:999px;
      font-size:13px; font-weight:600; letter-spacing:.3px;
    }
    h1 { margin:20px 0 8px; font-size:30px; }
    p { color: var(--muted); line-height:1.6; margin:0 0 8px; }
    .accent { color: var(--accent); font-weight:600; }
    footer { margin-top:24px; font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">☁️ Amazon S3 · Static Website</span>
    <h1>It's live on AWS!</h1>
    <p>This page is served from an <span class="accent">Amazon S3 bucket</span> — no server, no cost, 100% free tier.</p>
    <p>My first cloud deployment. 🚀</p>
    <footer>Built by Amrutha · Hosted on AWS S3</footer>
  </main>
</body>
</html>
